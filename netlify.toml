[build]
  publish = "build"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────
# Applied to all responses from Netlify

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking: only allow your own site to frame itself
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing (stops browsers from executing disguised files)
    X-Content-Type-Options = "nosniff"

    # Enable browser XSS filter (defense-in-depth for older browsers)
    X-XSS-Protection = "1; mode=block"

    # Control what information is sent in the Referer header
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict browser feature access (camera, mic, geolocation, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # Content Security Policy removed to prevent blocking inline scripts and third party resources.

    # Enforce HTTPS (Netlify handles this, but belt-and-suspenders)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
