[build]
  publish = "build"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────
# Applied to all responses from Netlify

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking: only allow your own site to frame itself
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing (stops browsers from executing disguised files)
    X-Content-Type-Options = "nosniff"

    # Enable browser XSS filter (defense-in-depth for older browsers)
    X-XSS-Protection = "1; mode=block"

    # Control what information is sent in the Referer header
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict browser feature access (camera, mic, geolocation, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # Content Security Policy: allow your own scripts, Firebase, Vanta.js CDNs, Google Auth, and reCAPTCHA
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://apis.google.com https://www.gstatic.com https://www.gstatic.com/recaptcha/ https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://recaptcha.google.com; object-src 'none'; base-uri 'self'; form-action 'self';"

    # Enforce HTTPS (Netlify handles this, but belt-and-suspenders)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
